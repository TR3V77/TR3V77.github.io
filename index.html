<style>
  :root {
    --bg: #f2f5f9;
    --surface: #ffffff;
    --ink: #0b1220;
    --ink-soft: #4b5870;
    --rule: #d3dbe7;
    --accent: #0a7a56;
    --accent-ink: #ffffff;
    --glow: rgba(10, 122, 86, 0.25);
    --grid: rgba(11, 18, 32, 0.06);
    --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #080c14;
      --surface: #0f1622;
      --ink: #e5ecf6;
      --ink-soft: #8d9bb3;
      --rule: #1d2940;
      --accent: #3ddc97;
      --accent-ink: #06130d;
      --glow: rgba(61, 220, 151, 0.28);
      --grid: rgba(120, 150, 200, 0.07);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #080c14;
    --surface: #0f1622;
    --ink: #e5ecf6;
    --ink-soft: #8d9bb3;
    --rule: #1d2940;
    --accent: #3ddc97;
    --accent-ink: #06130d;
    --glow: rgba(61, 220, 151, 0.28);
    --grid: rgba(120, 150, 200, 0.07);
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  /* Faint engineering-grid backdrop that fades out down the page */
  body::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 46rem; pointer-events: none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: linear-gradient(to bottom, #000 10%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 10%, transparent 100%);
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .wrap { max-width: 70rem; margin: 0 auto; padding: 0 1.5rem; position: relative; z-index: 1; }

  /* Header */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.5rem 0; gap: 1rem; flex-wrap: wrap;
  }
  .brand { font-family: var(--mono); font-weight: 700; font-size: 1rem; text-decoration: none; letter-spacing: -0.01em; }
  .brand::before { content: "> "; color: var(--accent); }
  nav.links { display: flex; gap: 1.5rem; align-items: center; font-family: var(--mono); font-size: 0.9rem; }
  nav.links a { text-decoration: none; color: var(--ink-soft); border-bottom: 1px solid transparent; padding-bottom: 2px; }
  nav.links a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  header.top.scrolled { border-bottom-color: var(--rule); }
  .header-icons { display: flex; gap: 0.5rem; align-items: center; }
  .header-icons a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.1rem; height: 2.1rem; border: 1px solid var(--rule); border-radius: 6px;
    color: var(--ink-soft); text-decoration: none;
  }
  .header-icons a:hover { border-color: var(--accent); color: var(--accent); }
  .header-icons svg { width: 1.05rem; height: 1.05rem; }

  /* Hero */
  .hero { padding: clamp(3rem, 8vw, 6rem) 0 clamp(3rem, 6vw, 4.5rem); }
  .hero-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; align-items: center; }
  @media (min-width: 62rem) { .hero-grid { grid-template-columns: 1.35fr 1fr; gap: 3.5rem; } }
  .hero h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.4rem, 6.4vw, 4.6rem);
    line-height: 1.02; letter-spacing: -0.035em;
    margin: 0 0 1.5rem;
  }
  .hero h1 span { color: var(--accent); }
  .hero p { max-width: 36rem; color: var(--ink-soft); margin: 0 0 2rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 2rem; }
  .tags span {
    font-family: var(--mono); font-size: 0.82rem; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px; padding: 0.25rem 0.7rem;
  }
  .cta {
    display: inline-block; font-family: var(--mono); font-weight: 500; font-size: 0.95rem;
    background: var(--accent); color: var(--accent-ink); text-decoration: none;
    padding: 0.8rem 1.3rem; border-radius: 6px;
    box-shadow: 0 8px 28px -10px var(--glow);
  }
  .cta::after { content: " \2192"; }
  .cta:hover { filter: brightness(1.08); }

  /* Terminal card */
  .term {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    font-family: var(--mono); font-size: 0.875rem; line-height: 1.6;
    box-shadow: 0 24px 60px -28px var(--glow);
    overflow: hidden;
  }
  .term-bar { display: flex; align-items: center; gap: 0.4rem; padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--rule); }
  .term-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); display: block; }
  .term-bar b { margin-left: auto; font-weight: 400; color: var(--ink-soft); font-size: 0.78rem; }
  .term-body { padding: 1rem 1.1rem 1.15rem; }
  .term-body .cmd { color: var(--ink); margin-top: 0.85rem; }
  .term-body .cmd:first-child { margin-top: 0; }
  .term-body .cmd::before { content: "$ "; color: var(--accent); }
  .term-body .out { color: var(--ink-soft); overflow-wrap: anywhere; }
  .caret { display: inline-block; width: 0.55em; height: 1.05em; background: var(--accent); vertical-align: text-bottom; margin-left: 2px; }

  /* Sections */
  section { padding: clamp(2.5rem, 6vw, 4.5rem) 0; border-top: 1px solid var(--rule); }
  h2 {
    font-family: var(--display); font-weight: 700; letter-spacing: -0.03em;
    font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.1; margin: 0 0 0.6rem;
  }
  h2::before { content: "// "; color: var(--accent); font-family: var(--mono); font-weight: 400; font-size: 0.7em; letter-spacing: 0; }
  .lede { color: var(--ink-soft); margin: 0 0 2rem; max-width: 36rem; }

  /* Filters */
  .filters[hidden] { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .filters button {
    font-family: var(--mono); font-size: 0.85rem;
    background: transparent; color: var(--ink-soft); border: 1px solid var(--rule);
    border-radius: 6px; padding: 0.35rem 0.85rem; cursor: pointer;
  }
  .filters button:hover { border-color: var(--accent); color: var(--accent); }
  .filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Project list */
  .projects { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .project { border-bottom: 1px solid var(--rule); }
  .project > button {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: grid; grid-template-columns: 1fr auto; gap: 0.4rem 1.5rem; align-items: baseline;
    padding: 1.5rem 0.75rem 1.5rem 1.1rem; position: relative;
  }
  .project > button::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); box-shadow: 0 0 18px var(--glow);
    transform: scaleY(0); transform-origin: top; transition: transform 0.25s ease;
  }
  .project > button:hover::before, .project > button[aria-expanded="true"]::before { transform: scaleY(1); }
  .project > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .p-title { font-family: var(--display); font-weight: 700; letter-spacing: -0.03em; font-size: clamp(1.4rem, 3.2vw, 2rem); line-height: 1.15; }
  .p-meta { font-family: var(--mono); color: var(--ink-soft); font-size: 0.82rem; text-align: right; }
  .p-stat { grid-column: 1 / -1; font-family: var(--body); font-weight: 600; font-size: 0.98rem; margin-top: 0.15rem; }
  .p-stack { grid-column: 1 / -1; font-family: var(--mono); color: var(--accent); font-size: 0.85rem; margin-top: 0.15rem; }
  .p-body { display: none; padding: 0 1.1rem 1.75rem; }
  .project.open .p-body { display: block; }
  .p-body p { max-width: 42rem; margin: 0 0 1rem; }
  .p-body ul { max-width: 42rem; margin: 0 0 1.4rem; padding-left: 1.2rem; }
  .p-body li::marker { color: var(--accent); }
  .p-links { display: flex; gap: 1.25rem; flex-wrap: wrap; font-family: var(--mono); font-size: 0.9rem; }
  .p-links a {
    color: var(--accent); text-decoration: none; border: 1px solid var(--accent);
    border-radius: 6px; padding: 0.4rem 0.9rem;
  }
  .p-links a:hover { background: var(--accent); color: var(--accent-ink); }
  .empty { padding: 2rem 1rem; color: var(--ink-soft); }

  /* About / experience */
  .two { display: grid; grid-template-columns: 1fr; gap: 2.5rem; }
  @media (min-width: 52rem) { .two { grid-template-columns: 1.1fr 1fr; gap: 4rem; } }
  .about p { margin: 0 0 1.1rem; max-width: 36rem; }
  .skills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
  .skills span {
    font-family: var(--mono); font-size: 0.82rem; background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; padding: 0.25rem 0.65rem;
  }
  .skills span:hover { border-color: var(--accent); color: var(--accent); }
  .exp { list-style: none; margin: 0; padding: 0; }
  .exp li { padding: 1.1rem 0; border-bottom: 1px solid var(--rule); }
  .exp li:first-child { padding-top: 0; }
  .exp-desc { margin: 0.6rem 0 0; font-size: 1rem; }
  .exp-points { margin: 0.6rem 0 0; padding-left: 1.1rem; font-size: 1rem; color: var(--ink); }
  .exp-points li { padding: 0; border: 0; margin-bottom: 0.4rem; }
  .exp strong { font-family: var(--display); font-size: 1.15rem; display: block; letter-spacing: -0.01em; }
  .exp span { color: var(--ink-soft); font-family: var(--mono); font-size: 0.82rem; }

  /* Contact */
  .contact-links { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; font-family: var(--mono); font-size: 0.95rem; }
  .contact-links a {
    color: var(--accent); text-decoration: none; border: 1px solid var(--rule);
    background: var(--surface); border-radius: 6px; padding: 0.55rem 1rem;
  }
  .contact-links a:hover { border-color: var(--accent); }
  footer { padding: 2rem 0 3rem; color: var(--ink-soft); font-family: var(--mono); font-size: 0.82rem; border-top: 1px solid var(--rule); }

  @media (prefers-reduced-motion: no-preference) {
    .hero h1 { animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both; }
    .term { animation: rise 0.7s 0.15s cubic-bezier(.2,.7,.2,1) both; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>

(function () {

const listJoin = (a) => a.length < 3 ? a.join(" and ") : a.slice(0, -1).join(", ") + ", and " + a[a.length - 1];
(function () {
  const lines = [
    ["whoami", SITE.name.toLowerCase().replace(/\s+/g, "-")],
    ["cat education.txt", "b.s. computer science (computer engineering), texas state university"],
    ["status", "graduating december 2026, open to full-time roles"]
  ];
  const body = $("term-body");
  lines.forEach(([cmd, out]) => { body.appendChild(el("div", "cmd", cmd)); body.appendChild(el("div", "out", out)); });
  const last = el("div", "cmd"); last.appendChild(el("span", "caret")); body.appendChild(last);
})();
$("about-3").textContent = "I am most interested in " + listJoin(SITE.interests) + ".";
$("contact-lede").textContent = "Open to full-time roles in " + listJoin(SITE.interests) + ", starting after graduation in December 2026.";
$("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

SITE.skills.forEach(s => $("skills").appendChild(el("span", "", s)));
SITE.experience.forEach(e => {
  const li = el("li");
  li.appendChild(el("strong", "", e.role));
  li.appendChild(el("span", "", e.org + ", " + e.dates));
  if (e.desc) li.appendChild(el("p", "exp-desc", e.desc));
  if (e.points && e.points.length) {
    const ul = el("ul", "exp-points");
    e.points.forEach(t => ul.appendChild(el("li", "", t)));
    li.appendChild(ul);
  }
  $("exp").appendChild(li);
});
const shown = SITE.contact.filter(c => c.href);
if (shown.length) {
  shown.forEach(c => { const a = el("a", "", c.label); a.href = c.href; if (c.href.startsWith("http")) a.rel = "noopener"; $("contact-links").appendChild(a); });
} else {
  $("contact-links").appendChild(el("span", "", "Add your links in the SITE block at the top of the script."));
}

/* Projects */
let activeTag = "All";
const tags = ["All", ...Array.from(new Set(PROJECTS.flatMap(p => p.tags)))];

function renderFilters() {
  const box = $("filters"); box.innerHTML = "";
  box.hidden = PROJECTS.length < 3;
  if (box.hidden) return;
  tags.forEach(t => {
    const b = el("button", "", t); b.type = "button";
    b.setAttribute("aria-pressed", String(t === activeTag));
    b.onclick = () => { activeTag = t; renderFilters(); renderProjects(); };
    box.appendChild(b);
  });
}

function renderProjects() {
  const list = $("project-list"); list.innerHTML = "";
  const items = PROJECTS.filter(p => activeTag === "All" || p.tags.includes(activeTag));
  if (!items.length) { list.appendChild(el("li", "empty", "No projects with this tag yet.")); return; }
  items.forEach((p, i) => {
    const li = el("li", "project");
    const bodyId = "proj-body-" + i;
    const btn = el("button"); btn.type = "button";
    btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-controls", bodyId);
    btn.appendChild(el("span", "p-title", p.title));
    btn.appendChild(el("span", "p-meta", p.course ? p.course + ", " + p.year : p.year));
    if (p.stat) btn.appendChild(el("span", "p-stat", p.stat));
    btn.appendChild(el("span", "p-stack", p.stack));
    const body = el("div", "p-body"); body.id = bodyId;
    body.appendChild(el("p", "", p.summary));
    if (p.points && p.points.length) {
      const ul = el("ul"); p.points.forEach(t => ul.appendChild(el("li", "", t))); body.appendChild(ul);
    }
    const links = el("div", "p-links");
    if (p.links.code) { const a = el("a", "", "View Repository"); a.href = p.links.code; a.rel = "noopener"; links.appendChild(a); }
    if (p.links.demo) { const a = el("a", "", "Live Demo"); a.href = p.links.demo; a.rel = "noopener"; links.appendChild(a); }
    if (links.children.length) body.appendChild(links);
    btn.onclick = () => {
      const open = li.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
    };
    li.appendChild(btn); li.appendChild(body); list.appendChild(li);
  });
}
$("projects-lede").textContent = PROJECTS.length < 3 ? "Select a project to read more." : "Select a project to read more. Use the filters to narrow the list.";
renderFilters(); renderProjects();
if (PROJECTS.length === 1) { const only = document.querySelector(".project > button"); if (only) only.click(); }

</script>
</body>
</html>
